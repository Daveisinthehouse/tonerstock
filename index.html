<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Toner Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>window.__appScriptLoaded = true;</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --paper:#EFE9DD;
  --paper-raised:#F7F3E9;
  --ink:#211F1B;
  --ink-soft:#6B6862;
  --line:#D8D0BE;
  --ok:#3A6B63;
  --ok-bg:#E1E9E4;
  --low:#C4451C;
  --low-bg:#F5DFD3;
  --out:#8C2E17;
  --out-bg:#EFC9BB;
  --hp:#2B5FA8;
  --kyocera:#7A3B9C;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1915;
    --paper-raised:#232019;
    --ink:#EDE8DA;
    --ink-soft:#A39D8B;
    --line:#3B372C;
    --ok:#6FBFAE;
    --ok-bg:#233330;
    --low:#F0895B;
    --low-bg:#3A2519;
    --out:#F06B4B;
    --out-bg:#3D2016;
    --hp:#6FA3E0;
    --kyocera:#B98BDE;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1915;
  --paper-raised:#232019;
  --ink:#EDE8DA;
  --ink-soft:#A39D8B;
  --line:#3B372C;
  --ok:#6FBFAE;
  --ok-bg:#233330;
  --low:#F0895B;
  --low-bg:#3A2519;
  --out:#F06B4B;
  --out-bg:#3D2016;
  --hp:#6FA3E0;
  --kyocera:#B98BDE;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', -apple-system, sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:920px;
  margin:0 auto;
  padding:28px 20px 80px;
}

/* header */
header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  padding-bottom:18px;
  border-bottom:3px solid var(--ink);
  margin-bottom:20px;
  flex-wrap:wrap;
}
h1{
  font-family:'Fjalla One', sans-serif;
  font-weight:400;
  font-size:38px;
  letter-spacing:0.5px;
  margin:0;
  line-height:1;
}
.sub{
  color:var(--ink-soft);
  font-size:14px;
  margin-top:6px;
}
.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.add-btn{
  background:var(--ink);
  color:var(--paper-raised);
  border:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  font-weight:500;
  padding:12px 18px;
  cursor:pointer;
  white-space:nowrap;
}
.add-btn:hover{ background:#3a372f; }
.scan-btn{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--ink);
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  font-weight:500;
  padding:12px 18px;
  cursor:pointer;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.scan-btn:hover{ background:var(--paper-raised); }
.scan-btn svg{ width:16px; height:16px; flex-shrink:0; }

/* stats strip */
.stats{
  display:flex;
  gap:0;
  margin-bottom:26px;
  border:1.5px solid var(--ink);
}
.stat{
  flex:1;
  padding:12px 16px;
  border-right:1.5px solid var(--ink);
}
.stat:last-child{ border-right:none; }
.stat .num{
  font-family:'IBM Plex Mono', monospace;
  font-size:26px;
  font-weight:600;
  line-height:1;
}
.stat .lbl{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:4px;
}
.stat.alert .num{ color:var(--low); }

/* controls */
.controls{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}
.tabs{ display:flex; gap:0; border:1.5px solid var(--ink); }
.tab{
  padding:8px 14px;
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  background:transparent;
  border:none;
  border-right:1.5px solid var(--ink);
  cursor:pointer;
  color:var(--ink);
}
.tab:last-child{ border-right:none; }
.tab.active{ background:var(--ink); color:var(--paper-raised); }
.search{
  flex:1;
  min-width:160px;
  padding:8px 12px;
  border:1.5px solid var(--ink);
  background:var(--paper-raised);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  color:var(--ink);
}
.search:focus{ outline:2px solid var(--hp); outline-offset:-2px; }

/* group heading */
.group-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:0.03em;
  color:var(--ink-soft);
  margin:26px 0 10px;
  display:flex;
  align-items:center;
  gap:10px;
}
.group-title::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}

/* card grid - shelf tags */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.tag{
  position:relative;
  background:var(--paper-raised);
  border:1.5px solid var(--ink);
  padding:14px 14px 12px;
}
.tag::before{
  content:'';
  position:absolute;
  top:-1.5px; left:16px;
  width:10px; height:10px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:50%;
}
.tag-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:10px;
}
.brand-badge{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  font-weight:600;
  padding:2px 7px;
  color:#fff;
}
.brand-badge.hp{ background:var(--hp); }
.brand-badge.kyocera{ background:var(--kyocera); }
.model{
  font-family:'IBM Plex Mono', monospace;
  font-size:18px;
  font-weight:600;
  margin:2px 0 2px;
}
.color-swatch{
  display:inline-block;
  width:9px; height:9px;
  border-radius:50%;
  margin-right:6px;
  border:1px solid rgba(0,0,0,0.25);
  vertical-align:middle;
}
.color-row{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.printers{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:12px;
  line-height:1.4;
}
.printers b{ color:var(--ink); font-weight:500; }
.tag-bottom{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-top:1px dashed var(--line);
  padding-top:10px;
}
.qty-block .qty{
  font-family:'IBM Plex Mono', monospace;
  font-size:26px;
  font-weight:600;
  line-height:1;
}
.qty-block .qty-lbl{
  font-size:11px;
  color:var(--ink-soft);
}
.status{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  font-weight:600;
  padding:4px 8px;
}
.status.ok{ background:var(--ok-bg); color:var(--ok); }
.status.low{ background:var(--low-bg); color:var(--low); }
.status.out{ background:var(--out-bg); color:var(--out); }

.tag-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}
.tag-actions button{
  flex:1;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  padding:6px 0;
  cursor:pointer;
}
.tag-actions button:hover{ border-color:var(--ink); color:var(--ink); }
.tag-actions button.danger:hover{ border-color:var(--low); color:var(--low); }

/* qty adjust buttons */
.qty-adjust{ display:flex; gap:4px; align-items:center; }
.qty-adjust button{
  width:24px; height:24px;
  border:1px solid var(--ink);
  background:var(--paper-raised);
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  cursor:pointer;
  line-height:1;
  padding:0;
}
.qty-adjust button:hover{ background:var(--ink); color:var(--paper-raised); }

/* empty state */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
}
.empty .big{
  font-family:'Fjalla One', sans-serif;
  font-size:22px;
  color:var(--ink);
  margin-bottom:8px;
}

/* modal */
.overlay{
  position:fixed; inset:0;
  background:rgba(33,31,27,0.55);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:50;
}
.modal{
  background:var(--paper-raised);
  border:2px solid var(--ink);
  width:100%; max-width:440px;
  max-height:88vh;
  overflow-y:auto;
  padding:24px;
}
.modal h2{
  font-family:'Fjalla One', sans-serif;
  font-weight:400;
  font-size:24px;
  margin:0 0 18px;
}
.field{ margin-bottom:14px; }
.field label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin-bottom:5px;
  letter-spacing:0.02em;
}
.field input, .field select{
  width:100%;
  padding:9px 10px;
  border:1.5px solid var(--ink);
  background:var(--paper);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  color:var(--ink);
}
.field input:focus, .field select:focus{ outline:2px solid var(--hp); outline-offset:-2px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.modal-actions button{
  flex:1;
  padding:11px 0;
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  font-weight:500;
  border:1.5px solid var(--ink);
  cursor:pointer;
}
.btn-primary{ background:var(--ink); color:var(--paper-raised); }
.btn-primary:hover{ background:#3a372f; }
.btn-secondary{ background:transparent; color:var(--ink); }
.btn-secondary:hover{ background:var(--paper); }

.loading{
  text-align:center;
  padding:80px 20px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
}

/* scanner */
.scan-modal{
  background:#111;
  border:2px solid var(--ink);
  width:100%; max-width:420px;
  padding:0;
  overflow:hidden;
}
.scan-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:var(--ink);
  color:var(--paper-raised);
}
.scan-header h2{
  font-family:'Fjalla One', sans-serif;
  font-weight:400;
  font-size:18px;
  margin:0;
}
.scan-close{
  background:transparent;
  border:1px solid var(--paper-raised);
  color:var(--paper-raised);
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding:5px 10px;
  cursor:pointer;
}
#scanner-viewport{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#000;
  overflow:hidden;
}
#scanner-viewport video, #scanner-viewport canvas{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
}
.scan-frame{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:78%; height:34%;
  border:2px solid var(--low);
  box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  pointer-events:none;
}
.scan-status{
  padding:12px 16px;
  color:var(--paper-raised);
  background:#111;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  text-align:center;
  border-top:1px solid #333;
}
.scan-status.found{ color:#8fd6c4; }
.scan-tally{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 16px;
  background:#1a1a1a;
  border-top:1px solid #333;
}
#tally-text{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:#8fd6c4;
  font-weight:600;
}
#undo-btn{
  background:transparent;
  border:1px solid #555;
  color:var(--paper-raised);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  padding:6px 12px;
  cursor:pointer;
  white-space:nowrap;
}
#undo-btn:hover{ border-color:var(--low); color:var(--low); }
.scan-footer{
  padding:12px 16px 16px;
  background:#111;
}
.manual-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:#999;
  margin-bottom:8px;
}
.manual-row{
  display:flex;
  gap:8px;
}
.manual-row input{
  flex:1;
  padding:12px 10px;
  border:1.5px solid #444;
  background:#1c1c1c;
  color:var(--paper-raised);
  font-family:'IBM Plex Mono', monospace;
  font-size:16px;
}
.manual-row button{
  background:var(--low);
  border:none;
  color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  padding:0 18px;
  cursor:pointer;
}
.barcode-note{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  background:var(--low-bg);
  color:var(--low);
  padding:8px 10px;
  margin-bottom:16px;
  border:1px solid var(--low);
}
.item-barcode{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin-top:-4px;
  margin-bottom:8px;
}

@media (max-width:600px){
  .wrap{ padding:18px 14px 90px; }
  h1{ font-size:32px; }
  .sub{ font-size:13.5px; }
  header{ padding-bottom:16px; margin-bottom:16px; }
  .header-actions{ width:100%; }
  .header-actions button{ flex:1; }
  .scan-btn, .add-btn{ padding:14px 12px; font-size:13.5px; justify-content:center; }
  .stats{ flex-wrap:wrap; }
  .stat{ flex:1 1 50%; border-bottom:1.5px solid var(--ink); padding:14px 14px; }
  .stat .num{ font-size:24px; }
  .controls{ gap:8px; }
  .tabs{ width:100%; }
  .tab{ flex:1; padding:10px 6px; font-size:12px; text-align:center; }
  .search{ width:100%; padding:11px 12px; font-size:16px; }
  .grid{ grid-template-columns:1fr; gap:10px; }
  .tag{ padding:16px 16px 14px; }
  .model{ font-size:19px; }
  .qty-block .qty{ font-size:28px; }
  .qty-adjust button{ width:32px; height:32px; font-size:17px; }
  .tag-actions button{ padding:9px 0; font-size:12px; }
  .modal{ padding:20px; max-height:92vh; }
  .field input, .field select{ font-size:16px; padding:11px 10px; }
  .modal-actions button{ padding:13px 0; }
}
</style>
</head>
<body>

<div class="wrap" id="app"><div class="empty"><div class="big">Toner Stock</div><div>Starting app…</div></div></div>

<script>
const SUPABASE_URL = 'https://itfdphlhftknnuuarfud.supabase.co';
const SUPABASE_KEY = atob('c2JfcHVibGlzaGFibGVfWTd3R2N4ekllMjIwNDlERzFHWWlVUV9lYlNuNjNRNQ==');
const API_BASE = SUPABASE_URL + '/rest/v1';
const AUTH_BASE = SUPABASE_URL + '/auth/v1';
let session = JSON.parse(localStorage.getItem('tonerstock_session') || 'null');
let items = [];
let currentUser = session && session.user ? session.user : null;
let loaded = false;
function saveSession(s){session=s||null;if(session)localStorage.setItem('tonerstock_session',JSON.stringify(session));else localStorage.removeItem('tonerstock_session');currentUser=session&&session.user?session.user:null;}
async function parseResponse(res){const text=await res.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){data=text;}if(!res.ok){const msg=(data&&(data.message||data.error_description||data.hint||data.error))||('HTTP '+res.status);return {data:null,error:new Error(msg),status:res.status};}return {data,error:null,status:res.status};}
async function authFetch(path,body){const res=await fetch(AUTH_BASE+path,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});return parseResponse(res);}
async function refreshSession(){if(!session?.refresh_token)return false;const r=await authFetch('/token?grant_type=refresh_token',{refresh_token:session.refresh_token});if(r.error){saveSession(null);return false;}saveSession(r.data);return true;}
async function apiFetch(path,options={}){const headers=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'},options.headers||{});if(session?.access_token)headers.Authorization='Bearer '+session.access_token;let res=await fetch(API_BASE+path,Object.assign({},options,{headers}));let out=await parseResponse(res);if(out.status===401&&session?.refresh_token){if(await refreshSession()){headers.Authorization='Bearer '+session.access_token;res=await fetch(API_BASE+path,Object.assign({},options,{headers}));out=await parseResponse(res);}}return out;}
async function ensureSession(){if(!session)return false;if(session.expires_at&&Date.now()>Number(session.expires_at)*1000-60000)await refreshSession();if(!session?.access_token){saveSession(null);return false;}return true;}
let activeFilter = 'all';
let searchTerm = '';
let editingId = null;

const COLOR_HEX = {
  Black: '#1a1a1a',
  Cyan: '#1f8fc7',
  Magenta: '#c22a86',
  Yellow: '#e0b400',
  'N/A': '#999'
};

async function loadItems(){loaded=false;render();try{if(!await ensureSession()){loaded=true;render();return;}const r=await apiFetch('/toner_items?select=*&order=brand.asc,model.asc');if(r.error){loaded=true;document.getElementById('app').innerHTML='<div class="empty"><div class="big">Database connection problem</div><div>'+escapeHtml(r.error.message)+'</div><div style="margin-top:12px"><button class="add-btn" onclick="loadItems()">RETRY</button></div></div>';return;}items=r.data||[];loaded=true;render();}catch(e){loaded=true;document.getElementById('app').innerHTML='<div class="empty"><div class="big">Database connection problem</div><div>'+escapeHtml(e.message)+'</div></div>';}}
async function saveItems(){return true;}

function uid(){
  return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function statusOf(item){
  if(item.quantity <= 0) return 'out';
  if(item.quantity <= item.minThreshold) return 'low';
  return 'ok';
}

function statusLabel(s){
  if(s === 'out') return 'OUT OF STOCK';
  if(s === 'low') return 'REORDER';
  return 'IN STOCK';
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matchesFilter(item){
  if(activeFilter === 'hp' && item.brand !== 'HP') return false;
  if(activeFilter === 'kyocera' && item.brand !== 'Kyocera') return false;
  if(activeFilter === 'low' && statusOf(item) === 'ok') return false;
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    const hay = (item.model + ' ' + item.printers + ' ' + item.color).toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = '<div class="loading">Loading stock…</div>';
    return;
  }

  if(!currentUser){ app.innerHTML = renderLogin(); return; }
  const total = items.length;
  const lowCount = items.filter(i => statusOf(i) !== 'ok').length;
  const totalUnits = items.reduce((s,i) => s + (Number(i.quantity)||0), 0);

  const filtered = items.filter(matchesFilter);
  const hpItems = filtered.filter(i => i.brand === 'HP');
  const kyoItems = filtered.filter(i => i.brand === 'Kyocera');

  let html = `
    <header>
      <div>
        <h1>Toner Stock</h1>
        <div class="sub">HP &amp; Kyocera cartridge tracking</div>
      </div>
      <div class="header-actions">
        <button class="scan-btn" onclick="openScanner()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M4 12h16"/></svg>
          SCAN
        </button>
        <button class="scan-btn" onclick="exportCSV()">CSV EXPORT</button>
        <button class="add-btn" onclick="openModal()">+ ADD CARTRIDGE</button>
        <button class="scan-btn" onclick="signOut()">SIGN OUT</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="num">${total}</div>
        <div class="lbl">SKUs tracked</div>
      </div>
      <div class="stat">
        <div class="num">${totalUnits}</div>
        <div class="lbl">Units on hand</div>
      </div>
      <div class="stat ${lowCount ? 'alert' : ''}">
        <div class="num">${lowCount}</div>
        <div class="lbl">Need reorder</div>
      </div>
    </div>

    <div class="controls">
      <div class="tabs">
        <button class="tab ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">ALL</button>
        <button class="tab ${activeFilter==='hp'?'active':''}" onclick="setFilter('hp')">HP</button>
        <button class="tab ${activeFilter==='kyocera'?'active':''}" onclick="setFilter('kyocera')">KYOCERA</button>
        <button class="tab ${activeFilter==='low'?'active':''}" onclick="setFilter('low')">LOW STOCK</button>
      </div>
      <input class="search" type="text" placeholder="Search model or printer…" value="${escapeHtml(searchTerm)}" oninput="setSearch(this.value)">
    </div>
  `;

  if(total === 0){
    html += `
      <div class="empty">
        <div class="big">No cartridges yet</div>
        <div>Add your first toner to start tracking stock.</div>
      </div>
    `;
  } else if(filtered.length === 0){
    html += `
      <div class="empty">
        <div class="big">Nothing matches</div>
        <div>Try a different filter or search term.</div>
      </div>
    `;
  } else {
    if(hpItems.length){
      html += `<div class="group-title">HP — ${hpItems.length}</div><div class="grid">`;
      hpItems.forEach(i => html += renderTag(i));
      html += `</div>`;
    }
    if(kyoItems.length){
      html += `<div class="group-title">KYOCERA — ${kyoItems.length}</div><div class="grid">`;
      kyoItems.forEach(i => html += renderTag(i));
      html += `</div>`;
    }
  }

  app.innerHTML = html;
}

function renderTag(item){
  const s = statusOf(item);
  const printers = (item.printers || '').split(',').map(p => p.trim()).filter(Boolean);
  const colorHex = COLOR_HEX[item.color] || '#999';
  return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <span class="brand-badge ${item.brand === 'HP' ? 'hp' : 'kyocera'}">${item.brand.toUpperCase()}</span>
          <div class="model">${escapeHtml(item.model)}</div>
        </div>
      </div>
      <div class="color-row"><span class="color-swatch" style="background:${colorHex}"></span>${escapeHtml(item.color)}</div>
      ${item.barcode ? `<div class="item-barcode">#${escapeHtml(item.barcode)}</div>` : ''}
      <div class="printers">${printers.length ? '<b>Fits:</b> ' + printers.map(escapeHtml).join(', ') : 'No printer models listed'}</div>
      <div class="tag-bottom">
        <div class="qty-block">
          <div class="qty-adjust">
            <button onclick="adjustQty('${item.id}', -1)">−</button>
            <div>
              <div class="qty">${item.quantity}</div>
              <div class="qty-lbl">on hand · min ${item.minThreshold}</div>
            </div>
            <button onclick="adjustQty('${item.id}', 1)">+</button>
          </div>
        </div>
        <div class="status ${s}">${statusLabel(s)}</div>
      </div>
      <div class="tag-actions">
        <button onclick="openModal('${item.id}')">EDIT</button>
        <button class="danger" onclick="deleteItem('${item.id}')">DELETE</button>
      </div>
    </div>
  `;
}

function setFilter(f){ activeFilter = f; render(); }
function setSearch(v){ searchTerm = v; render(); }

async function adjustQty(id,delta){const item=items.find(i=>i.id===id);if(!item)return;const r=await apiFetch('/rpc/adjust_toner_stock',{method:'POST',body:JSON.stringify({p_toner_id:id,p_delta:delta,p_event_type:delta>0?'manual_add':'manual_remove',p_barcode:item.barcode||null})});if(r.error){alert(r.error.message);return;}Object.assign(item,r.data);render();}

async function deleteItem(id){const item=items.find(i=>i.id===id);if(!item)return;if(!confirm('Delete '+item.brand+' '+item.model+'?'))return;const r=await apiFetch('/toner_items?id=eq.'+encodeURIComponent(id),{method:'DELETE'});if(r.error){alert(r.error.message);return;}items=items.filter(i=>i.id!==id);render();}

function openModal(id, prefillBarcode){
  editingId = id || null;
  const item = id ? items.find(i => i.id === id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  const barcodeVal = item ? (item.barcode || '') : (prefillBarcode || '');

  overlay.innerHTML = `
    <div class="modal">
      <h2>${item ? 'Edit cartridge' : 'Add cartridge'}</h2>
      ${prefillBarcode && !item ? `<div class="barcode-note">New barcode scanned — #${escapeHtml(prefillBarcode)}. Fill in the details below to add it to stock.</div>` : ''}
      <div class="field-row">
        <div class="field">
          <label>BRAND</label>
          <select id="f-brand">
            <option value="HP" ${item && item.brand==='HP' ? 'selected' : ''}>HP</option>
            <option value="Kyocera" ${item && item.brand==='Kyocera' ? 'selected' : ''}>Kyocera</option>
          </select>
        </div>
        <div class="field">
          <label>COLOR</label>
          <select id="f-color">
            ${['Black','Cyan','Magenta','Yellow','N/A'].map(c =>
              `<option value="${c}" ${item && item.color===c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>MODEL / PART NUMBER</label>
        <input id="f-model" type="text" placeholder="e.g. 410A or TK-3172" value="${item ? escapeHtml(item.model) : ''}">
      </div>
      <div class="field">
        <label>BARCODE (OPTIONAL)</label>
        <input id="f-barcode" type="text" placeholder="Scanned automatically, or enter manually" value="${escapeHtml(barcodeVal)}">
      </div>
      <div class="field">
        <label>COMPATIBLE PRINTERS</label>
        <input id="f-printers" type="text" placeholder="e.g. M477fdw, M452dn" value="${item ? escapeHtml(item.printers||'') : ''}">
        <div class="field-hint">Comma-separated list of printer models</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>QUANTITY ON HAND</label>
          <input id="f-qty" type="number" min="0" value="${item ? item.quantity : 0}">
        </div>
        <div class="field">
          <label>REORDER AT</label>
          <input id="f-min" type="number" min="0" value="${item ? item.minThreshold : 1}">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">CANCEL</button>
        <button class="btn-primary" onclick="saveItem()">${item ? 'SAVE CHANGES' : 'ADD TO STOCK'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('f-model').focus();
}

function closeModal(){
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.remove();
  editingId = null;
}

async function saveItem(){const model=document.getElementById('f-model').value.trim();if(!model){alert('Enter a model or part number.');return;}const payload={brand:document.getElementById('f-brand').value,color:document.getElementById('f-color').value,model,barcode:document.getElementById('f-barcode').value.trim()||null,printers:document.getElementById('f-printers').value.trim(),quantity:Math.max(0,parseInt(document.getElementById('f-qty').value)||0),min_threshold:Math.max(0,parseInt(document.getElementById('f-min').value)||0)};const r=await apiFetch(editingId?'/toner_items?id=eq.'+encodeURIComponent(editingId):'/toner_items',{method:editingId?'PATCH':'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});if(r.error){alert(r.error.message);return;}const data=Array.isArray(r.data)?r.data[0]:r.data;if(editingId)Object.assign(items.find(i=>i.id===editingId),data);else items.push(data);closeModal();render();}

/* ---------- barcode scanner ---------- */
let scanLocked = false;
let scanHistory = [];
let audioCtx = null;

function findByBarcode(code){
  return items.find(i => i.barcode && i.barcode === code);
}

function ensureAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playTone(ctx, freq, dur, delay){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + delay + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + dur + 0.03);
}

function beep(kind){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(kind === 'match'){
    playTone(ctx, 880, 0.09, 0);
  } else if(kind === 'new'){
    playTone(ctx, 560, 0.09, 0);
    playTone(ctx, 560, 0.09, 0.15);
  } else if(kind === 'undo'){
    playTone(ctx, 320, 0.12, 0);
  }
}

function openScanner(){
  scanLocked = false;
  scanHistory = [];
  ensureAudioCtx(); // unlock audio now, inside this click gesture, so later beeps play on iOS

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'scan-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeScanner(); };

  overlay.innerHTML = `
    <div class="scan-modal">
      <div class="scan-header">
        <h2>Scan barcode</h2>
        <button class="scan-close" onclick="closeScanner()">DONE</button>
      </div>
      <div id="scanner-viewport">
        <div class="scan-frame"></div>
      </div>
      <div class="scan-tally" id="scan-tally" style="display:none;">
        <span id="tally-text">0 scanned</span>
        <button id="undo-btn" onclick="undoLastScan()">UNDO LAST</button>
      </div>
      <div class="scan-status" id="scan-status">Starting camera…</div>
      <div class="scan-footer">
        <div class="manual-label">Or type the barcode</div>
        <div class="manual-row" id="manual-row">
          <input id="manual-input" type="text" inputmode="numeric" placeholder="Barcode number">
          <button onclick="submitManualBarcode()">GO</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  startQuagga();
}

function submitManualBarcode(){
  const val = document.getElementById('manual-input').value.trim();
  if(!val) return;
  document.getElementById('manual-input').value = '';
  handleScannedCode(val);
}

function startQuagga(){
  const viewport = document.getElementById('scanner-viewport');
  if(!viewport || typeof Quagga === 'undefined'){
    setScanStatus('Camera library failed to load — use manual entry below.', false);
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanStatus("This browser can't access the camera here — use manual entry below.", false);
    return;
  }

  Quagga.init({
    inputStream: {
      name: 'Live',
      type: 'LiveStream',
      target: viewport,
      constraints: {
        facingMode: { ideal: 'environment' }
      }
    },
    locator: { patchSize: 'medium', halfSample: true },
    numOfWorkers: 0,
    decoder: {
      readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader', 'code_39_reader']
    },
    locate: true
  }, function(err){
    if(err){
      console.error('Quagga init error:', err);
      const reason = (err && (err.name || err.message)) || 'unknown error';
      let msg = 'Camera unavailable (' + reason + ') — use manual entry below.';
      if(reason === 'NotAllowedError' || reason === 'PermissionDeniedError'){
        msg = 'Camera permission blocked. Check Settings → Safari → Camera, or the site permissions icon in the address bar, then try Scan again.';
      } else if(reason === 'NotFoundError' || reason === 'OverconstrainedError'){
        msg = 'No usable camera found on this device — use manual entry below.';
      } else if(reason === 'NotReadableError'){
        msg = 'Camera is in use by another app — close it and try again, or use manual entry.';
      }
      setScanStatus(msg, false);
      return;
    }

    // iOS Safari requires these on the <video> element or it silently fails to render
    const video = viewport.querySelector('video');
    if(video){
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');
      video.setAttribute('muted', 'true');
      video.muted = true;
      video.play().catch(() => {});
    }

    Quagga.start();
    setScanStatus('Point the camera at the barcode…', false);
  });

  Quagga.onDetected(onQuaggaDetected);
}

function onQuaggaDetected(result){
  if(scanLocked) return;
  const code = result && result.codeResult && result.codeResult.code;
  if(!code) return;
  handleScannedCode(code);
}

function setScanStatus(text, found){
  const el = document.getElementById('scan-status');
  if(!el) return;
  el.textContent = text;
  el.className = 'scan-status' + (found ? ' found' : '');
}

function refreshTally(){
  const tally = document.getElementById('scan-tally');
  if(!tally) return;
  if(scanHistory.length === 0){
    tally.style.display = 'none';
    return;
  }
  tally.style.display = 'flex';
  document.getElementById('tally-text').textContent = scanHistory.length + ' scanned this session';
}

async function handleScannedCode(code){
  scanLocked = true;
  const existing = findByBarcode(code);

  if(existing){
    beep('match');
    const r=await apiFetch('/rpc/adjust_toner_stock',{method:'POST',body:JSON.stringify({p_toner_id:existing.id,p_delta:1,p_event_type:'scan',p_barcode:code})});if(r.error){scanLocked=false;setScanStatus('Stock update failed: '+r.error.message,false);return;}Object.assign(existing,r.data);
    scanHistory.push({ id: existing.id, brand: existing.brand, model: existing.model });
    render();
    refreshTally();
    setScanStatus(`+1 ${existing.brand} ${existing.model} → now ${existing.quantity} in stock. Keep scanning…`, true);
    // brief cooldown so the same box isn't double-counted from consecutive video frames,
    // then automatically resume scanning for the next item
    setTimeout(() => {
      scanLocked = false;
      if(document.getElementById('scan-status')){
        setScanStatus('Point the camera at the next barcode…', false);
      }
    }, 1400);
  } else {
    beep('new');
    setScanStatus(`New barcode #${code} — opening details…`, true);
    setTimeout(() => {
      closeScanner();
      openModal(null, code);
    }, 700);
  }
}

async function undoLastScan(){
  if(!scanHistory.length) return;
  const last = scanHistory.pop();
  const item = items.find(i => i.id === last.id);
  if(item){
    const r=await apiFetch('/rpc/adjust_toner_stock',{method:'POST',body:JSON.stringify({p_toner_id:item.id,p_delta:-1,p_event_type:'undo',p_barcode:item.barcode||null})});if(r.error){alert(r.error.message);return;}Object.assign(item,r.data);
    render();
    beep('undo');
    setScanStatus(`Removed 1 ${last.brand} ${last.model} → now ${item.quantity}. Keep scanning…`, false);
  }
  refreshTally();
}

function closeScanner(){
  try{
    if(typeof Quagga !== 'undefined'){
      Quagga.offDetected(onQuaggaDetected);
      Quagga.stop();
    }
  }catch(e){ /* ignore */ }
  const overlay = document.getElementById('scan-overlay');
  if(overlay) overlay.remove();
}

function renderLogin(){
  return `<header><div><h1>Toner Stock</h1><div class="sub">Shared HP &amp; Kyocera inventory</div></div></header>
  <div class="modal" style="margin:40px auto;display:block">
    <h2>Sign in</h2>
    <div class="field"><label>EMAIL</label><input id="auth-email" type="email" autocomplete="email"></div>
    <div class="field"><label>PASSWORD</label><input id="auth-password" type="password" autocomplete="current-password"></div>
    <div class="modal-actions"><button class="btn-secondary" onclick="signUp()">CREATE ACCOUNT</button><button class="btn-primary" onclick="signIn()">SIGN IN</button></div>
    <div class="field-hint" style="margin-top:12px">Use the same account on your iPhone and other devices to share stock.</div>
  </div>`;
}
async function signIn(){const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value;if(!email||!password){alert('Enter your email and password.');return;}const r=await authFetch('/token?grant_type=password',{email,password});if(r.error){alert(r.error.message);return;}saveSession(r.data);await loadItems();}
async function signUp(){const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value;if(!email){alert('Enter your email address.');return;}if(password.length<6){alert('Password must be at least 6 characters.');return;}const r=await authFetch('/signup',{email,password});if(r.error){alert(r.error.message);return;}if(r.data?.access_token){saveSession(r.data);await loadItems();}else alert('Account created. Check your email if confirmation is required, then sign in.');}
async function signOut(){if(session?.access_token){try{await fetch(AUTH_BASE+'/logout',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token}});}catch(e){}}saveSession(null);items=[];loaded=true;render();}
async function exportCSV(){const r=await apiFetch('/toner_items?select=*&order=brand.asc,model.asc');if(r.error){alert(r.error.message);return;}const cols=['brand','model','color','barcode','printers','quantity','min_threshold','updated_at'];const csv=[cols.join(','),...(r.data||[]).map(x=>cols.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toner-stock.csv';a.click();URL.revokeObjectURL(a.href);}
if(session){loadItems();setInterval(()=>{if(session&&currentUser&&!document.getElementById('scan-overlay')&&!document.getElementById('overlay'))refreshItemsSilently();},15000);}else{loaded=true;render();}
async function refreshItemsSilently(){const r=await apiFetch('/toner_items?select=*&order=brand.asc,model.asc');if(!r.error&&Array.isArray(r.data)){items=r.data;render();}}
</script>
